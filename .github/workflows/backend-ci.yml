name: Backend RSpec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"

      - name: Install gems
        run: bundle install

      - name: Prepare test database
        run: bin/rails db:test:prepare
        env:
          RAILS_ENV: test

      - name: Run RSpec
        run: bundle exec rspec
        env:
          RAILS_ENV: test
